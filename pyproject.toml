[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesisforge"
version = "0.1.0"
description = "Multi-Agent Research Gap Discovery and Experimental Hypothesis Generation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
    "pypdf>=4.0.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
